name: Релиз

on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 архива, подписанного на Mac владельца
        required: true
        type: string

permissions:
  contents: write
concurrency:
  group: salary-flow-publication
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Скачать и проверить подписанную сборку
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+$ && "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          version=${GITHUB_REF_NAME#v}
          asset="SalaryFlow-$version.zip"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          # Also handles retry after publication but before updating the feed.
          git show origin/main:appcast.xml > "$RUNNER_TEMP/current.xml"
          python3 - "$RUNNER_TEMP/current.xml" "$version" <<'PY'
          import sys, xml.etree.ElementTree as ET
          latest = ET.parse(sys.argv[1]).findtext('./channel/item/{http://www.andymatuschak.org/xml-namespaces/sparkle}version')
          def parts(version): return tuple(map(int, version.split('.')))
          if parts(sys.argv[2]) < parts(latest): sys.exit("Release older than current feed")
          PY
          mkdir -p .build/release
          gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir .build/release
          echo "$SHA256  .build/release/$asset" | shasum -a 256 -c -
          ditto -x -k ".build/release/$asset" "$RUNNER_TEMP/payload"
          ./Tools/verify-release-app.sh "$RUNNER_TEMP/payload/SalaryFlow.app" "$version"
          ./Tools/fetch-sparkle.sh

      - name: Подписать обновление для Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing Sparkle key}"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            .build/release
          version=${GITHUB_REF_NAME#v}
          swift Tools/verify-release-feed.swift .build/release/appcast.xml ".build/release/SalaryFlow-$version.zip" "$version"

      - name: Опубликовать проверенный архив и ленту
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          asset="SalaryFlow-${GITHUB_REF_NAME#v}.zip"
          release=$(gh release view "$GITHUB_REF_NAME" --json assets,isDraft)
          jq -e --arg file "$asset" --arg digest "sha256:$SHA256" \
            '(.assets | length) == 1 and .assets[0].name == $file and .assets[0].digest == $digest' <<< "$release"
          if [[ $(jq -r '.isDraft' <<< "$release") == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
          git fetch origin main
          git checkout -B main origin/main
          cp .build/release/appcast.xml appcast.xml
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "appcast для $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
